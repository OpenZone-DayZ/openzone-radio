# Переносна половина профілю для dayz-agentic-modding-mcp.
# Машинні шляхи живуть у dayz-mcp.local.toml, який не комітиться.
#
# Базовий @OpenZone_Radio вимагає ЯДРО (з 2026-09-20: ефір і гашетка їдуть
# його конвертами) і CF, але не КПК. КПК жорстко вимагають лише СКЛЕЙКИ --
# @OpenZone_Radio_PDA і @OpenZone_Radio_VPP, -- і саме тому вони окремі pbo.
# Ядро й КПК підставляються стендові через [mods] extra у локальному файлі.

[project]
name = "openzone-radio"

[build]
# Вкладка VPP -- окремий НЕОБОВ'ЯЗКОВИЙ pbo: requiredAddons у ньому жорсткі,
# і сервер без VPP мусить крутити рацію як ні в чому не бувало.
# Порядок значущий: склейки жорстко вимагають базовий мод, і пакувати їх
# раніше за нього немає сенсу.
mods = ["OpenZone_Radio", "OpenZone_Radio_PDA", "OpenZone_Radio_VPP"]
# Моделі рацій -- частина OpenZone_Radio (OpenZone_Radio/model/<рація>), а не окремий pbo:
# з 2026-09-25 окремого аддона моделей немає. Їхні вихідні скрипти -- у models/.
#
# binarize не має ключа для кореня: корінь -- його робоча тека, і кожен шлях, зашитий у
# модель, рахується від неї. Моделі посилаються на OpenZone_Radio\model\... і на ванільні
# dz\data\data\..., тож корінь тримає обидві теки: models/assets/_kit/radiokit.py
# (prepare_model_root) пише MLOD у build/model-root/OpenZone_Radio/model/<рація>/ і
# під'єднує туди data\ з мода та ванільний dz\. Збірка однієї моделі:
# asset_build(mod="OpenZone_Radio", source="model/<рація>").
project_root = "build/model-root"

[expect]
ready_line   = "radio loaded"
max_warnings = 0
forbid       = ["Bad type", "Can't compile", "NULL pointer to instance",
                # модель, текстура чи матеріал, що не знайшлися: шлях у p3d або rvmat
                # не той, куди лягли файли (див. [build] project_root)
                "No components in openzone_radio\\model",
                "Cannot open object openzone_radio\\model",
                "Cannot load texture openzone_radio\\model",
                "Cannot load material file openzone_radio\\model"]
error_regex  = ["SCRIPT\\s+\\(E\\).*OZR_"]
# Ядро ходить до моста по http на 127.0.0.1 і чесно попереджає про це
# кожен бут. На локальному стенді це стан, а не подія: без цього рядка
# max_warnings = 0 робить вердикт вічно червоним і ховає справжні
# попередження. Той самий рядок уже стоїть у КПК з тієї ж причини.
noise        = ["Bridge.Url is not https"]

# Виміряно на буті 2026-08-31 12:42 (script_2026-08-31_12-42-13.log).
#
# bands -- ПОХІДНЕ число, а не налаштування: ефір рахується з профілів
# (НСД кроків і меж), і саме тому воно тут. Зіпсований профіль не
# кричить -- він тихо дає інший ефір, і зловити це можна лише числом.
# Обидва рухаються, коли адмін навмисне править профілі; тоді число тут
# треба переписати так само навмисне.
[expect.counters]
bands    = 400
profiles = 7
