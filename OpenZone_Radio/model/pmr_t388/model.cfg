// Model configuration: one CfgModels class per p3d (name = file name). A model with no
// class of its own silently falls back to Default. sections[] lists the hidden
// selections config.cpp may retexture - here the range label on the case.

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};
	class oz_radio_t388: Default
	{
		sections[] = {};
	};
};
