# A tag proxy-v* becomes a GitHub release with the frequency proxy, built
# here. The prefix keeps this apart from the mod's own versions: the DLL and
# the pbo ship on their own clocks, and one tag namespace for both would say
# the radio is at 1.0 because its proxy is.
#
# The proxy is a native DLL, so the release is not a copy of anything from a
# developer's machine: the runner compiles it from native/src with the same
# build.ps1 an admin would run, and uploads what came out. The build script
# finds the toolchain with vswhere, which windows-latest already carries.
name: release

on:
  push:
    tags: ['proxy-v*']

permissions:
  contents: write

jobs:
  # The Linux library is built and tested first, and nothing is published
  # unless it passes. The Windows job below is the one that creates the
  # release, so a library that fails on the runner has to stop the run before
  # there is a release for it to be missing from.
  linux-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: build and test the library
        run: sh native/linux/build.sh test

  windows:
    needs: linux-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: build the proxy
        shell: pwsh
        run: .\native\build.ps1

      # What an admin needs beside the DLL: the frequencies it reads, and the
      # page that says where the file goes and where it must NOT go.
      - name: assemble the release folder
        shell: pwsh
        run: |
          $ver  = "${{ github.ref_name }}" -replace '^proxy-', ''
          $name = "openzone-frequency-proxy-$ver-win64"
          New-Item -ItemType Directory -Force -Path "dist\$name" | Out-Null
          Copy-Item native\build\hid.dll          "dist\$name\"
          Copy-Item native\oz_frequencies.json    "dist\$name\"
          Copy-Item native\README.md              "dist\$name\"
          Copy-Item LICENSE, NOTICE               "dist\$name\"
          Compress-Archive -Path "dist\$name\*" -DestinationPath "dist\$name.zip" -Force
          Get-Item "dist\$name.zip" | ForEach-Object { "packed $($_.Name), $([math]::Round($_.Length/1KB)) KB" }

      # The hash goes in the notes: an unsigned DLL off the internet deserves
      # at least a number the admin can check against the file they downloaded.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = (Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1).FullName
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          $notes = @"
          Server-side native mod that raises DayZ's eight radio channels to a number set in JSON.

          Built by this workflow from ``native/src`` on windows-latest, not uploaded from anyone's machine.

          **Where it goes.** Beside the DayZ **server** executable, with ``oz_frequencies.json`` next to it. It patches the process only when that process was launched with ``-server`` or is named ``DayZServer_x64.exe``.

          **Where it must not go.** Not into a directory you play retail DayZ from. It patches nothing there thanks to the gate above, but BattlEye blocks an unsigned DLL and says so in the launcher.

          **Linux.** The ``-linux64.tar.gz`` archive of this release holds ``oz_frequencies.so`` for the native Linux server, built and tested by the same workflow on ubuntu-22.04. Start the server with ``LD_PRELOAD=/full/path/oz_frequencies.so`` in front of its command line; the Windows archive is not needed there.

          ``README.md`` inside the archive has the rest, including what is patched and why.

          SHA256 of the Windows archive: ``$sha``
          "@
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $ver = $tag -replace '^proxy-', ''
            gh release create $tag --title "OpenZone frequency proxy $ver" --notes $notes
          }
          gh release upload $tag $zip --clobber

  # The same release gets the library for the native Linux server. It waits for
  # the Windows job because that one creates the release; two jobs creating it
  # at once is a race one of them loses.
  linux:
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # Built again here, from the same commit, and tested again: what is
      # uploaded is what this job has just seen pass.
      - name: build and test the library
        run: sh native/linux/build.sh test

      - name: assemble and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          ver="${tag#proxy-}"
          name="openzone-frequency-proxy-$ver-linux64"
          mkdir -p "dist/$name"
          cp native/build/oz_frequencies.so native/oz_frequencies.json native/README.md LICENSE NOTICE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          sha256sum "dist/$name.tar.gz"
          gh release upload "$tag" "dist/$name.tar.gz" --clobber
